name: TrayFold
options:
  bundleIdPrefix: com.rezaahmadn
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Signing identity lives in an .xcconfig so a git-ignored local file can
# override it (see Scripts/setup-signing.sh).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    # Ad-hoc ("-") unless Config/Signing.local.xcconfig names a local certificate.
    CODE_SIGN_IDENTITY: "$(TRAYFOLD_SIGN_IDENTITY)"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  TrayFold:
    type: application
    platform: macOS
    sources:
      - path: TrayFold
    info:
      path: TrayFold/Info.plist
      properties:
        CFBundleDisplayName: TrayFold
        CFBundleName: TrayFold
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Menu-bar-only app: no Dock icon, no app menu.
        LSUIElement: true
        # Modern lookups (Finder, the Accessibility list in System Settings) find the
        # icon by asset name, not by CFBundleIconFile; without this they show a blank icon.
        CFBundleIconName: AppIcon
        NSHumanReadableCopyright: "MIT License"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rezaahmadn.TrayFold
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete

  TrayFoldTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TrayFoldTests
    dependencies:
      - target: TrayFold
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rezaahmadn.TrayFoldTests
        # Test bundles need an Info.plist too; let Xcode generate it.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TrayFold:
    build:
      targets:
        TrayFold: all
        TrayFoldTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TrayFoldTests
